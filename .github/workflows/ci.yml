name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          ini-values: zend.assertions=1, error_reporting=-1
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      - name: Lint the examples
        run: for f in examples/*.php examples/laravel/*.php; do php -l "$f"; done

  coverage:
    name: Coverage (90% minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer coverage

  analysis:
    name: Static analysis, style and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer tools:install
      - name: Audit the library and every tool (fails on any advisory or abandoned package)
        run: composer audit:all
      - name: PHP-CS-Fixer (PSR-12, PER-CS 2.0)
        run: composer cs
      - name: PHPStan (level max, strict rules)
        run: composer phpstan
      - name: Psalm (level 1)
        run: composer psalm
      - name: Psalm taint analysis (SARIF for code scanning)
        run: php tools/psalm/vendor/bin/psalm --taint-analysis --no-progress --report=psalm-taint.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('psalm-taint.sarif') != ''
        with:
          sarif_file: psalm-taint.sarif
          category: psalm-taint
